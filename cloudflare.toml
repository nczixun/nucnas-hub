# Reference only: Cloudflare Pages build settings are configured in its dashboard.
# See docs/deployment.md; this file is not a Wrangler configuration.
name = "nucnas-hub"
build_command = "hugo --minify"
build_dir = "public"

[environment]
  HUGO_ENABLEGITINFO = "true"
  HUGO_HASCJKLANGUAGE = "true"

[site]
  charset = "utf-8"
  language = "zh-CN"
