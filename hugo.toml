baseURL = "https://www.nucnas.top/"
languageCode = "zh-CN"
title = "NUC NAS Hub"
enableRobotsTXT = true
enableGitInfo = true

# UTF-8 encoding
defaultContentLanguage = "zh"
hasCJKLanguage = true

# Hosting checkouts may have shallow Git history. Use recorded editorial dates,
# not the newest deployment commit, for sitemap and Article freshness.
[frontmatter]
  lastmod = ["lastmod", "modified", "date", "publishdate", "pubdate", "published"]

[encoding]
  charset = "utf-8"

# 单一语言，不再使用多语言
# defaultContentLanguage = "zh"
# defaultContentLanguageInSubdir = true

# [languages]
#   [languages.zh]
#     languageName = "中文"
#     weight = 1
#     title = "NUC NAS Hub - 迷你主机与NAS测评网"
    
#   [languages.en]
#     languageName = "English"
#     weight = 2
#     title = "NUC NAS Hub - Mini PC & NAS Reviews"

[pagination]
  pagerSize = 12

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]

[taxonomies]
  tag = "tags"
  category = "categories"

[sitemap]
  changefreq = "daily"
  filename = "sitemap.xml"
  priority = 0.5

[params]
  description = "迷你主机型号核对、NAS备份恢复教程、本地AI部署指南与计算工具。文章注明来源、适用版本和核查范围。"

[permalinks]
  posts = "/post/:slug/"
  hardware = "/review/:slug/"
  nas = "/guide/:slug/"
  ai = "/ai/:slug/"
  page = "/:slug/"

# minify disabled due to Chinese encoding issues
# [minify]
#   disableXML = true
#   minifyOutput = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true
