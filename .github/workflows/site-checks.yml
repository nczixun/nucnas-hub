name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install production Hugo version
        run: |
          curl --fail --location --retry 3 https://github.com/gohugoio/hugo/releases/download/v0.147.7/hugo_0.147.7_linux-amd64.tar.gz -o /tmp/hugo.tar.gz
          echo "7aec6feaadc9cce9f633cd4fd46e021fbd7213dc3a2b4ea3cee3e01109625609  /tmp/hugo.tar.gz" | sha256sum --check
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
      - name: Build and verify generated pages
        run: |
          python3 scripts/verify_routes.py /tmp/hugo
          python3 scripts/verify_content.py /tmp/hugo
          python3 scripts/verify_source_evidence.py /tmp/hugo
          /tmp/hugo --minify
          python3 scripts/verify_site.py
          python3 scripts/verify_date_metadata.py public /tmp/hugo
          python3 scripts/test_local_rag.py
          python3 scripts/audit_links.py public
          node scripts/test_browser_arithmetic.cjs
          node scripts/test_search_filters.cjs
          node scripts/test_growth_calculators.cjs public
