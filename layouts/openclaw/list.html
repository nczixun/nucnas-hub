{{ define "main" }}
<article class="article-page">
  <header class="list-header"><h1 class="list-title">{{ .Title }}</h1><p class="list-desc">{{ .Description }}</p></header>
  <div class="article-content" style="max-width:800px;margin:0 auto;line-height:1.8;">{{ .Content }}</div>
</article>
{{ end }}
