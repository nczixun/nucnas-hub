<section class="search-page">
<h1>搜索文章</h1><form action="/search/" role="search" class="search-form" id="article-search">
<label for="query">关键词</label><div class="search-controls"><input id="query" name="q" type="search" placeholder="例如：NAS、Ollama、迷你主机"><button type="submit">搜索</button></div>
<div class="search-filters"><label for="search-section">栏目</label><select id="search-section" name="section"><option value="">全部栏目</option><option value="hardware">硬件</option><option value="nas">NAS</option><option value="ai">AI</option><option value="openclaw">OpenClaw旧入口</option><option value="calculator">工具</option></select><label class="review-filter"><input type="checkbox" id="search-reviewed" name="reviewed" value="1">仅看已做资料核对</label></div>
</form><p class="search-help">核查状态会显示在结果中；已核对资料不等于完成硬件或软件实测。</p>
<p id="search-status" role="status" aria-live="polite">输入关键词，搜索本站教程和测评。</p>
<div id="search-results" class="search-results"></div>
<noscript><p>站内搜索需要 JavaScript。你也可以<a href="/posts/">浏览全部文章</a>。</p></noscript>
</section>
{{ $script := resources.Get "js/search.js" | minify | fingerprint }}<script src="{{ $script.RelPermalink }}" defer></script>
